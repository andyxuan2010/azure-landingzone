name: Terraform

on:
  push:
    branches:
      - main
      - dev
      - sbx
  pull_request:
    branches:
      - main
      - dev
      - sbx
  workflow_dispatch:
    inputs:
      ENABLE_GITHUB_APPLY:
        description: Run terraform apply after plan for this workflow run
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validation-precheck:
    name: Check Required Secrets and Variables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_infracost_api_key: ${{ steps.check.outputs.has_infracost_api_key }}
      has_module_download_secret: ${{ steps.check.outputs.has_module_download_secret }}
      has_deploy_envs: ${{ steps.check.outputs.has_deploy_envs }}
      has_apply_inputs: ${{ steps.check.outputs.has_apply_inputs }}
      has_stage_publish_inputs: ${{ steps.check.outputs.has_stage_publish_inputs }}
      has_ado_dev_publish_inputs: ${{ steps.check.outputs.has_ado_dev_publish_inputs }}
      has_ado_prod_publish_inputs: ${{ steps.check.outputs.has_ado_prod_publish_inputs }}
      is_stage_repository: ${{ steps.check.outputs.is_stage_repository }}
      deploy_matrix: ${{ steps.check.outputs.deploy_matrix }}
    steps:
      - name: Evaluate required secrets and variables
        id: check
        shell: bash
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          AZURE_ADO_PAT2: ${{ secrets.AZURE_ADO_PAT2 }}
          DEPLOY_DEV: ${{ vars.DEPLOY_DEV }}
          DEPLOY_SANDBOX: ${{ vars.DEPLOY_SANDBOX }}
          ENABLE_GITHUB_APPLY: ${{ vars.ENABLE_GITHUB_APPLY }}
          ENABLE_GITHUB_APPLY_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.ENABLE_GITHUB_APPLY == true && 'true' || 'false' }}
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_URL: ${{ secrets.STAGE_REPO_URL }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          ADO_DEV_REPOSITORY: ${{ vars.ADO_DEV_REPOSITORY }}
          ADO_REPO_URL: ${{ secrets.ADO_REPO_URL }}
          ADO_REPO_DEV_PAT: ${{ secrets.ADO_REPO_DEV_PAT }}
          ADO_REPO_PAT: ${{ secrets.ADO_REPO_PAT }}
          PUBLISH_ADO_PROD: ${{ vars.PUBLISH_ADO_PROD }}
          ADO_PROD_REPOSITORY: ${{ vars.ADO_PROD_REPOSITORY }}
          ADO_PROD_REPO_PAT: ${{ secrets.ADO_PROD_REPO_PAT }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          write_check() {
            local input_type="$1"
            local input_name="$2"
            local input_value="$3"
            local blue="\033[34m"
            local yellow="\033[33m"
            local green="\033[32m"
            local red="\033[31m"
            local reset="\033[0m"

            if [[ -n "${input_value}" ]]; then
              printf -- "- %b%s%b %b%s%b: %bpresent%b\n" "${blue}" "${input_type}" "${reset}" "${yellow}" "${input_name}" "${reset}" "${green}" "${reset}"
            else
              printf -- "- %b%s%b %b%s%b: %bmissing%b\n" "${blue}" "${input_type}" "${reset}" "${yellow}" "${input_name}" "${reset}" "${red}" "${reset}"
            fi
          }

          enable_github_apply=""
          deploy_envs_display=""
          ado_prod_publish_display=""

          [[ "${ENABLE_GITHUB_APPLY,,}" == "true" || "${ENABLE_GITHUB_APPLY_MANUAL,,}" == "true" ]] && enable_github_apply="true"
          [[ "${DEPLOY_DEV,,}" == "true" || "${DEPLOY_SANDBOX,,}" == "true" ]] && deploy_envs_display="true"
          [[ "${PUBLISH_ADO_PROD,,}" == "true" ]] && ado_prod_publish_display="true"

          echo "::group::Required secrets and variables"
          echo "Validate and plan require:"
          write_check "secret" "AZURE_ADO_PAT2" "${AZURE_ADO_PAT2}"
          write_check "variable" "DEPLOY_DEV=true or DEPLOY_SANDBOX=true" "${deploy_envs_display}"
          echo "GitHub Environment secrets ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, and ARM_SUBSCRIPTION_ID are checked inside each deploy environment job."
          echo ""
          echo "Apply requires:"
          write_check "variable/input" "ENABLE_GITHUB_APPLY=true" "${enable_github_apply}"
          write_check "secret" "AZURE_ADO_PAT2" "${AZURE_ADO_PAT2}"
          write_check "variable" "DEPLOY_DEV=true or DEPLOY_SANDBOX=true" "${deploy_envs_display}"
          echo "GitHub Environment Azure secrets are checked inside the apply job."
          echo ""
          echo "Infracost requires:"
          write_check "secret" "INFRACOST_API_KEY" "${INFRACOST_API_KEY}"
          echo ""
          echo "Publish Github Stage Repo requires:"
          write_check "variable" "STAGE_REPOSITORY" "${STAGE_REPOSITORY}"
          write_check "secret" "STAGE_REPO_URL (legacy alternative to STAGE_REPOSITORY)" "${STAGE_REPO_URL}"
          write_check "secret" "STAGE_REPO_TOKEN" "${STAGE_REPO_TOKEN}"
          echo ""
          echo "Publish ADO Dev Repo requires:"
          write_check "variable" "ADO_DEV_REPOSITORY" "${ADO_DEV_REPOSITORY}"
          write_check "secret" "ADO_REPO_URL (legacy alternative to ADO_DEV_REPOSITORY)" "${ADO_REPO_URL}"
          write_check "secret" "ADO_REPO_DEV_PAT" "${ADO_REPO_DEV_PAT}"
          write_check "secret" "ADO_REPO_PAT (legacy alternative to ADO_REPO_DEV_PAT)" "${ADO_REPO_PAT}"
          echo ""
          echo "Publish ADO Production/Sandbox Repo requires:"
          write_check "variable" "PUBLISH_ADO_PROD=true" "${ado_prod_publish_display}"
          write_check "variable" "ADO_PROD_REPOSITORY" "${ADO_PROD_REPOSITORY}"
          write_check "secret" "ADO_PROD_REPO_PAT" "${ADO_PROD_REPO_PAT}"
          echo "::endgroup::"

          stage_repository_normalized=""
          if [[ -n "${STAGE_REPOSITORY}" ]]; then
            stage_repository_normalized="${STAGE_REPOSITORY#https://github.com/}"
          elif [[ -n "${STAGE_REPO_URL}" ]]; then
            stage_repository_normalized="${STAGE_REPO_URL#https://github.com/}"
          fi
          stage_repository_normalized="${stage_repository_normalized%.git}"
          stage_repository_normalized="${stage_repository_normalized#/}"
          stage_repository_normalized="${stage_repository_normalized%/}"

          if [[ -n "${stage_repository_normalized}" && "${CURRENT_REPOSITORY,,}" == "${stage_repository_normalized,,}" ]]; then
            echo "is_stage_repository=true" >> "${GITHUB_OUTPUT}"
            echo "Current repository matches the configured stage repository. Loop-prone jobs will be skipped for github-actions[bot]."
          else
            echo "is_stage_repository=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${INFRACOST_API_KEY}" ]]; then
            echo "has_infracost_api_key=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_infracost_api_key=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${AZURE_ADO_PAT2}" ]]; then
            echo "has_module_download_secret=true" >> "${GITHUB_OUTPUT}"
            has_module_download_secret="true"
          else
            echo "has_module_download_secret=false" >> "${GITHUB_OUTPUT}"
            has_module_download_secret="false"
            echo "Terraform module download secret is missing. Validate/plan jobs will be skipped."
          fi

          matrix='{"include":['
          separator=''

          add_environment() {
            local deploy_env="$1"
            local flag="$2"

            if [[ "${flag,,}" == "true" ]]; then
              matrix="${matrix}${separator}{\"deploy_env\":\"${deploy_env}\",\"terraform_var_file\":\"environments/${deploy_env}/terraform.tfvars\",\"terraform_backend_file\":\"environments/${deploy_env}/backend.hcl\"}"
              separator=','
            fi
          }

          add_environment "dev" "${DEPLOY_DEV:-false}"
          add_environment "sandbox" "${DEPLOY_SANDBOX:-false}"

          matrix="${matrix}]}"

          if [[ -n "${separator}" ]]; then
            echo "has_deploy_envs=true" >> "${GITHUB_OUTPUT}"
            has_deploy_envs="true"
          else
            echo "has_deploy_envs=false" >> "${GITHUB_OUTPUT}"
            has_deploy_envs="false"
            echo "No deploy environment variables are enabled. Validate/plan jobs will be skipped."
            matrix='{"include":[{"deploy_env":"dev","terraform_var_file":"environments/dev/terraform.tfvars","terraform_backend_file":"environments/dev/backend.hcl"}]}'
          fi

          echo "deploy_matrix=${matrix}" >> "${GITHUB_OUTPUT}"

          if [[ "${enable_github_apply}" == "true" && "${has_module_download_secret}" == "true" && "${has_deploy_envs}" == "true" ]]; then
            echo "has_apply_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_apply_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "Apply is disabled, module download secret is missing, or no deploy environments are enabled. Apply job will be skipped."
          fi

          if [[ -n "${STAGE_REPOSITORY}" || -n "${STAGE_REPO_URL}" ]] && [[ -n "${STAGE_REPO_TOKEN}" ]]; then
            echo "has_stage_publish_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_stage_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "Stage publish variable/secret is missing. Stage publish job will be skipped."
          fi

          if [[ -n "${ADO_DEV_REPOSITORY}" || -n "${ADO_REPO_URL}" ]] && [[ -n "${ADO_REPO_DEV_PAT}" || -n "${ADO_REPO_PAT}" ]]; then
            echo "has_ado_dev_publish_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_ado_dev_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "ADO dev publish variable/secret is missing. ADO dev publish job will be skipped."
          fi

          if [[ "${PUBLISH_ADO_PROD,,}" == "true" && -n "${ADO_PROD_REPOSITORY}" && -n "${ADO_PROD_REPO_PAT}" ]]; then
            echo "has_ado_prod_publish_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_ado_prod_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "ADO production/sandbox publish is disabled, or required variable/secret is missing. ADO production/sandbox publish job will be skipped."
          fi

  warm-provider-cache:
    name: Warm Terraform Provider Cache
    needs: validation-precheck
    if: (needs.validation-precheck.outputs.is_stage_repository != 'true' || github.actor != 'github-actions[bot]') && needs.validation-precheck.outputs.has_module_download_secret == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git auth for Terraform module downloads
        shell: bash
        env:
          AZURE_ADO_PAT2: ${{ secrets.AZURE_ADO_PAT2 }}
        run: |
          set -euo pipefail

          if [[ -z "${AZURE_ADO_PAT2}" ]]; then
            echo "Missing required secret: AZURE_ADO_PAT2" >&2
            exit 1
          fi

          git config --global --unset-all http.https://dev.azure.com/.extraheader || true
          git config --global --unset-all url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf || true
          git config --global url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf "https://dev.azure.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare Terraform plugin cache
        shell: bash
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Terraform init without backend
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6 7 8; do
            if terraform init -backend=false -input=false -no-color; then
              exit 0
            fi

            if [[ "${attempt}" -eq 8 ]]; then
              echo "terraform provider cache warmup failed after ${attempt} attempts" >&2
              exit 1
            fi

            rm -rf .terraform/providers
            sleep_seconds=$((attempt * 30))
            echo "terraform provider cache warmup failed; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

  validate-plan:
    name: Validate and Plan (${{ matrix.deploy_env }})
    needs:
      - validation-precheck
      - warm-provider-cache
    if: (needs.validation-precheck.outputs.is_stage_repository != 'true' || github.actor != 'github-actions[bot]') && needs.validation-precheck.outputs.has_module_download_secret == 'true' && needs.validation-precheck.outputs.has_deploy_envs == 'true' && needs.warm-provider-cache.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ matrix.deploy_env }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validation-precheck.outputs.deploy_matrix) }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${ARM_CLIENT_ID}" ]] || missing+=("ARM_CLIENT_ID")
          [[ -n "${ARM_CLIENT_SECRET}" ]] || missing+=("ARM_CLIENT_SECRET")
          [[ -n "${ARM_TENANT_ID}" ]] || missing+=("ARM_TENANT_ID")
          [[ -n "${ARM_SUBSCRIPTION_ID}" ]] || missing+=("ARM_SUBSCRIPTION_ID")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Environment secret(s) for %s: %s\n' "${{ matrix.deploy_env }}" "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure Git auth for Terraform module downloads
        shell: bash
        env:
          AZURE_ADO_PAT2: ${{ secrets.AZURE_ADO_PAT2 }}
        run: |
          set -euo pipefail

          if [[ -z "${AZURE_ADO_PAT2}" ]]; then
            echo "Missing required secret: AZURE_ADO_PAT2" >&2
            exit 1
          fi

          git config --global --unset-all http.https://dev.azure.com/.extraheader || true
          git config --global --unset-all url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf || true
          git config --global url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf "https://dev.azure.com/"

      - name: Resolve execution context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy_env=${{ matrix.deploy_env }}" >> "${GITHUB_OUTPUT}"
          echo "terraform_var_file=${{ matrix.terraform_var_file }}" >> "${GITHUB_OUTPUT}"
          echo "terraform_backend_file=${{ matrix.terraform_backend_file }}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare Terraform plugin cache
        shell: bash
        run: mkdir -p "${{ runner.temp }}/terraform-plugin-cache"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Terraform Init
        shell: bash
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6 7 8; do
            if terraform init -input=false -no-color -reconfigure -backend-config="${{ steps.context.outputs.terraform_backend_file }}"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 8 ]]; then
              echo "terraform init failed after ${attempt} attempts" >&2
              exit 1
            fi

            rm -rf .terraform/providers
            sleep_seconds=$((attempt * 30))
            echo "terraform init failed; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform root harness test
        if: hashFiles('tests/root-plan.tftest.hcl') != ''
        run: terraform test -filter=tests/root-plan.tftest.hcl -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file="${{ steps.context.outputs.terraform_var_file }}" -out=tfplan
        env:
          TF_VAR_environment: ${{ steps.context.outputs.deploy_env }}

      - name: Terraform plan summary
        shell: bash
        run: bash ./scripts/terraform-change-summary.sh tfplan "Terraform plan summary (${{ steps.context.outputs.deploy_env }})"

      - name: Setup Infracost
        if: needs.validation-precheck.outputs.has_infracost_api_key == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost report
        if: needs.validation-precheck.outputs.has_infracost_api_key == 'true'
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json tfplan > tfplan.json

          infracost breakdown \
            --path=tfplan.json \
            --format=json \
            --out-file=/tmp/infracost.json

          infracost output \
            --path=/tmp/infracost.json \
            --format=github-comment \
            --out-file=/tmp/infracost.md

          infracost output \
            --path=/tmp/infracost.json \
            --format=table \
            --show-skipped \
            --out-file=/tmp/infracost.txt

          {
            echo "## Infracost report"
            echo
            echo '```text'
            cat /tmp/infracost.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment Infracost on pull request
        if: github.event_name == 'pull_request' && needs.validation-precheck.outputs.has_infracost_api_key == 'true'
        shell: bash
        run: |
          set -euo pipefail

          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="${GITHUB_REPOSITORY}" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update

      - name: Upload Infracost artifacts
        if: needs.validation-precheck.outputs.has_infracost_api_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report-${{ steps.context.outputs.deploy_env }}-${{ github.run_id }}
          path: |
            /tmp/infracost.json
            /tmp/infracost.md
            /tmp/infracost.txt
          if-no-files-found: error

      - name: Upload plan artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.context.outputs.deploy_env }}-${{ github.run_id }}
          path: tfplan
          if-no-files-found: error

  apply:
    name: Apply Selected Environment (${{ matrix.deploy_env }})
    if: github.event_name != 'pull_request' && needs.validation-precheck.outputs.has_apply_inputs == 'true' && needs.validate-plan.result == 'success'
    needs:
      - validation-precheck
      - validate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ matrix.deploy_env }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validation-precheck.outputs.deploy_matrix) }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${ARM_CLIENT_ID}" ]] || missing+=("ARM_CLIENT_ID")
          [[ -n "${ARM_CLIENT_SECRET}" ]] || missing+=("ARM_CLIENT_SECRET")
          [[ -n "${ARM_TENANT_ID}" ]] || missing+=("ARM_TENANT_ID")
          [[ -n "${ARM_SUBSCRIPTION_ID}" ]] || missing+=("ARM_SUBSCRIPTION_ID")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Environment secret(s) for %s: %s\n' "${{ matrix.deploy_env }}" "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure Git auth for Terraform module downloads
        shell: bash
        env:
          AZURE_ADO_PAT2: ${{ secrets.AZURE_ADO_PAT2 }}
        run: |
          set -euo pipefail

          if [[ -z "${AZURE_ADO_PAT2}" ]]; then
            echo "Missing required secret: AZURE_ADO_PAT2" >&2
            exit 1
          fi

          git config --global --unset-all http.https://dev.azure.com/.extraheader || true
          git config --global --unset-all url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf || true
          git config --global url."https://ado:${AZURE_ADO_PAT2}@dev.azure.com/".insteadOf "https://dev.azure.com/"

      - name: Resolve execution context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy_env=${{ matrix.deploy_env }}" >> "${GITHUB_OUTPUT}"
          echo "terraform_var_file=${{ matrix.terraform_var_file }}" >> "${GITHUB_OUTPUT}"
          echo "terraform_backend_file=${{ matrix.terraform_backend_file }}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare Terraform plugin cache
        shell: bash
        run: mkdir -p "${{ runner.temp }}/terraform-plugin-cache"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Terraform Init
        shell: bash
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6 7 8; do
            if terraform init -input=false -no-color -reconfigure -backend-config="${{ steps.context.outputs.terraform_backend_file }}"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 8 ]]; then
              echo "terraform init failed after ${attempt} attempts" >&2
              exit 1
            fi

            rm -rf .terraform/providers
            sleep_seconds=$((attempt * 30))
            echo "terraform init failed; retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ steps.context.outputs.deploy_env }}-${{ github.run_id }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color tfplan
        env:
          TF_VAR_environment: ${{ steps.context.outputs.deploy_env }}

      - name: Terraform apply summary
        shell: bash
        run: bash ./scripts/terraform-change-summary.sh tfplan "Terraform apply summary (${{ steps.context.outputs.deploy_env }})"

  create-git-tag:
    name: Create Git Tag
    if: github.event_name != 'pull_request' && needs.validate-plan.result == 'success'
    needs:
      - validate-plan
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
      release_notes: ${{ steps.semver.outputs.release_notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create canonical GitHub release tag
        id: semver
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_tag_file="$(mktemp)"
          release_notes_file="$(mktemp)"

          bash scripts/create-release-tag.sh \
            --source-branch "${SOURCE_BRANCH}" \
            --source-sha "${SOURCE_SHA}" \
            --release-tag-file "${release_tag_file}" \
            --release-notes-file "${release_notes_file}"

          {
            echo "release_tag=$(cat "${release_tag_file}")"
            echo "release_notes<<EOF"
            cat "${release_notes_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  publish-stage-repo:
    name: Publish Github Stage Repo
    if: github.event_name != 'pull_request' && needs.validation-precheck.outputs.is_stage_repository != 'true' && needs.validation-precheck.outputs.has_stage_publish_inputs == 'true' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    needs:
      - validation-precheck
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish clean snapshot to stage repo
        env:
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_URL: ${{ secrets.STAGE_REPO_URL }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${STAGE_REPO_TOKEN}" ]]; then
            echo "Missing required secret: STAGE_REPO_TOKEN" >&2
            exit 1
          fi

          if [[ -n "${STAGE_REPOSITORY}" ]]; then
            target_repo="github.com/${STAGE_REPOSITORY%.git}"
          elif [[ -n "${STAGE_REPO_URL}" ]]; then
            target_repo="${STAGE_REPO_URL#https://}"
            target_repo="${target_repo%.git}"
          else
            echo "Missing required repository variable STAGE_REPOSITORY or legacy secret STAGE_REPO_URL" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "Stage snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_notes="${RELEASE_NOTES:-}"
            if [[ -z "${release_notes}" ]]; then
              release_notes="- ${SOURCE_SHA}"
            fi

            tag_message="$(mktemp)"
            {
              echo "Release ${RELEASE_TAG} snapshot"
              echo
              echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
              echo
              echo "Changes:"
              printf '%s\n' "${release_notes}"
            } > "${tag_message}"

            git tag -a "${RELEASE_TAG}" -F "${tag_message}"
          fi

          git remote add origin "https://x-access-token:${STAGE_REPO_TOKEN}@${target_repo}.git"
          git push --force origin "${SOURCE_BRANCH}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Stage repo already has tag ${RELEASE_TAG}; leaving it unchanged."
            else
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

  publish-ado-dev-repo:
    name: Publish ADO Dev Repo
    if: github.event_name != 'pull_request' && needs.validation-precheck.outputs.is_stage_repository != 'true' && needs.validation-precheck.outputs.has_ado_dev_publish_inputs == 'true' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    needs:
      - validation-precheck
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Git history to Azure DevOps dev repo
        env:
          ADO_DEV_REPOSITORY: ${{ vars.ADO_DEV_REPOSITORY }}
          ADO_REPO_URL: ${{ secrets.ADO_REPO_URL }}
          ADO_REPO_DEV_PAT: ${{ secrets.ADO_REPO_DEV_PAT }}
          ADO_REPO_PAT: ${{ secrets.ADO_REPO_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          ado_pat="${ADO_REPO_DEV_PAT:-${ADO_REPO_PAT:-}}"
          if [[ -z "${ado_pat}" ]]; then
            echo "Missing required secret ADO_REPO_DEV_PAT or legacy secret ADO_REPO_PAT" >&2
            exit 1
          fi

          if [[ -n "${ADO_DEV_REPOSITORY}" ]]; then
            target_repo="dev.azure.com/${ADO_DEV_REPOSITORY}"
          elif [[ -n "${ADO_REPO_URL}" ]]; then
            target_repo="${ADO_REPO_URL#https://}"
          else
            echo "Missing required repository variable ADO_DEV_REPOSITORY or legacy secret ADO_REPO_URL" >&2
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"

          remote_name="ado-dev"

          git remote remove "${remote_name}" >/dev/null 2>&1 || true
          git remote add "${remote_name}" "https://ado:${ado_pat}@${target_repo}"
          git fetch "${remote_name}" --prune
          git fetch --force --tags origin
          git push --force "${remote_name}" "refs/heads/${SOURCE_BRANCH}:refs/heads/${SOURCE_BRANCH}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            origin_tag_ref="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
            if [[ -z "${origin_tag_ref}" ]]; then
              echo "GitHub tag ${RELEASE_TAG} was not found on origin." >&2
              exit 1
            fi

            git tag -d "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git push --force "${remote_name}" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi

  publish-ado-production-repo:
    name: Publish ADO Production/Sandbox Repo
    if: github.event_name != 'pull_request' && needs.validation-precheck.outputs.is_stage_repository != 'true' && needs.validation-precheck.outputs.has_ado_prod_publish_inputs == 'true' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    needs:
      - validation-precheck
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Git history to Azure DevOps production+sandbox repo
        env:
          ADO_PROD_REPOSITORY: ${{ vars.ADO_PROD_REPOSITORY }}
          ADO_PROD_REPO_PAT: ${{ secrets.ADO_PROD_REPO_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ADO_PROD_REPO_PAT}" ]]; then
            echo "Missing required secret: ADO_PROD_REPO_PAT" >&2
            exit 1
          fi

          if [[ -z "${ADO_PROD_REPOSITORY}" ]]; then
            echo "Missing required repository variable: ADO_PROD_REPOSITORY" >&2
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"

          target_repo="dev.azure.com/${ADO_PROD_REPOSITORY}"
          remote_name="ado-prod"

          git remote remove "${remote_name}" >/dev/null 2>&1 || true
          git remote add "${remote_name}" "https://ado:${ADO_PROD_REPO_PAT}@${target_repo}"
          git fetch "${remote_name}" --prune
          git fetch --force --tags origin
          git push --force "${remote_name}" "refs/heads/${SOURCE_BRANCH}:refs/heads/${SOURCE_BRANCH}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            origin_tag_ref="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
            if [[ -z "${origin_tag_ref}" ]]; then
              echo "GitHub tag ${RELEASE_TAG} was not found on origin." >&2
              exit 1
            fi

            git tag -d "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git push --force "${remote_name}" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
