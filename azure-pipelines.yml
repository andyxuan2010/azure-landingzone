parameters:
  - name: useEnvironmentApprovals
    type: boolean
    default: false
  - name: sandboxEnvironmentName
    type: string
    default: 'landingzone-sandbox'
  - name: devEnvironmentName
    type: string
    default: 'landingzone-dev'

name: $(Build.Repository.Name)

resources:
  repositories:
    - repository: templateRepo
      type: git
      name: IaC/template
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - main
      - dev
      - sbx

pr: none

pool:
  name: 'Azure Pipelines'
  vmImage: 'ubuntu-latest'

variables:
  - name: terraformVersion
    value: '1.10.5'
  - name: selfRepoRoot
    value: '$(Pipeline.Workspace)/s/landingzone'

stages:
  - stage: Validate
    displayName: Common Validation
    jobs:
      - job: terraform_validate
        displayName: Terraform Validate
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            path: s/landingzone
          - checkout: templateRepo
            clean: true
            persistCredentials: true
            path: s/template

          - task: Bash@3
            displayName: Install Terraform
            inputs:
              targetType: filePath
              filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
              arguments: $(terraformVersion)
              workingDirectory: $(selfRepoRoot)

          - task: Bash@3
            displayName: Terraform fmt and validate
            inputs:
              targetType: filePath
              filePath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-validate.sh
              workingDirectory: $(selfRepoRoot)
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: PlanSandbox
    displayName: Plan Sandbox
    dependsOn: Validate
    condition: succeeded()
    variables:
      azureSubscription: 'sc-platform-sbx'
      terraformVarFile: 'environments/sandbox/terraform.tfvars'
      terraformBackendFile: 'environments/sandbox/backend.hcl'
      planArtifactName: 'terraform-plan-sandbox'
      planTextArtifactName: 'terraform-plan-sandbox-text'
      planFilePath: '$(Build.ArtifactStagingDirectory)/sandbox/terraform.tfplan'
      planTextPath: '$(Build.ArtifactStagingDirectory)/sandbox/terraform-plan.txt'
    jobs:
      - job: terraform_plan_sandbox
        displayName: Terraform Plan Sandbox
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            path: s/landingzone
          - checkout: templateRepo
            clean: true
            persistCredentials: true
            path: s/template

          - task: Bash@3
            displayName: Install Terraform
            inputs:
              targetType: filePath
              filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
              arguments: $(terraformVersion)
              workingDirectory: $(selfRepoRoot)

          - task: AzureCLI@2
            displayName: Terraform plan sandbox
            inputs:
              azureSubscription: 'sc-platform-sbx'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-plan.sh
              arguments: >-
                "$(terraformBackendFile)"
                "$(terraformVarFile)"
                "$(planFilePath)"
                "$(planTextPath)"
              workingDirectory: $(selfRepoRoot)
              addSpnToEnvironment: true
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Publish sandbox plan artifact
            inputs:
              targetPath: $(planFilePath)
              artifact: $(planArtifactName)

          - task: PublishPipelineArtifact@1
            displayName: Publish sandbox plan text
            inputs:
              targetPath: $(planTextPath)
              artifact: $(planTextArtifactName)

  - stage: PlanDev
    displayName: Plan Dev
    dependsOn: Validate
    condition: succeeded()
    variables:
      azureSubscription: 'sc-platform-dev'
      terraformVarFile: 'environments/dev/terraform.tfvars'
      terraformBackendFile: 'environments/dev/backend.hcl'
      planArtifactName: 'terraform-plan-dev'
      planTextArtifactName: 'terraform-plan-dev-text'
      planFilePath: '$(Build.ArtifactStagingDirectory)/dev/terraform.tfplan'
      planTextPath: '$(Build.ArtifactStagingDirectory)/dev/terraform-plan.txt'
    jobs:
      - job: terraform_plan_dev
        displayName: Terraform Plan Dev
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            path: s/landingzone
          - checkout: templateRepo
            clean: true
            persistCredentials: true
            path: s/template

          - task: Bash@3
            displayName: Install Terraform
            inputs:
              targetType: filePath
              filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
              arguments: $(terraformVersion)
              workingDirectory: $(selfRepoRoot)

          - task: AzureCLI@2
            displayName: Terraform plan dev
            inputs:
              azureSubscription: 'sc-platform-dev'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-plan.sh
              arguments: >-
                "$(terraformBackendFile)"
                "$(terraformVarFile)"
                "$(planFilePath)"
                "$(planTextPath)"
              workingDirectory: $(selfRepoRoot)
              addSpnToEnvironment: true
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Publish dev plan artifact
            inputs:
              targetPath: $(planFilePath)
              artifact: $(planArtifactName)

          - task: PublishPipelineArtifact@1
            displayName: Publish dev plan text
            inputs:
              targetPath: $(planTextPath)
              artifact: $(planTextArtifactName)

  - stage: ApplySandbox
    displayName: Apply Sandbox
    dependsOn: PlanSandbox
    condition: succeeded()
    variables:
      azureSubscription: 'sc-platform-sbx'
      terraformBackendFile: 'environments/sandbox/backend.hcl'
      downloadedPlanPath: '$(Pipeline.Workspace)/terraform-plan-sandbox/terraform.tfplan'
    jobs:
      - ${{ if eq(parameters.useEnvironmentApprovals, true) }}:
        - deployment: terraform_apply_sandbox
          displayName: Terraform Apply Sandbox
          environment: ${{ parameters.sandboxEnvironmentName }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    clean: true
                    persistCredentials: true
                    path: s/landingzone
                  - checkout: templateRepo
                    clean: true
                    persistCredentials: true
                    path: s/template

                  - task: Bash@3
                    displayName: Install Terraform
                    inputs:
                      targetType: filePath
                      filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
                      arguments: $(terraformVersion)
                      workingDirectory: $(selfRepoRoot)

                  - task: DownloadPipelineArtifact@2
                    displayName: Download sandbox plan artifact
                    inputs:
                      buildType: current
                      artifactName: terraform-plan-sandbox
                      targetPath: $(Pipeline.Workspace)/terraform-plan-sandbox

                  - task: AzureCLI@2
                    displayName: Terraform apply sandbox
                    inputs:
                      azureSubscription: 'sc-platform-sbx'
                      scriptType: bash
                      scriptLocation: scriptPath
                      scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-apply.sh
                      arguments: >-
                        "$(terraformBackendFile)"
                        "$(downloadedPlanPath)"
                      workingDirectory: $(selfRepoRoot)
                      addSpnToEnvironment: true
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - ${{ if ne(parameters.useEnvironmentApprovals, true) }}:
        - job: terraform_apply_sandbox
          displayName: Terraform Apply Sandbox
          steps:
            - checkout: self
              clean: true
              persistCredentials: true
              path: s/landingzone
            - checkout: templateRepo
              clean: true
              persistCredentials: true
              path: s/template

            - task: Bash@3
              displayName: Install Terraform
              inputs:
                targetType: filePath
                filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
                arguments: $(terraformVersion)
                workingDirectory: $(selfRepoRoot)

            - task: DownloadPipelineArtifact@2
              displayName: Download sandbox plan artifact
              inputs:
                buildType: current
                artifactName: terraform-plan-sandbox
                targetPath: $(Pipeline.Workspace)/terraform-plan-sandbox

            - task: AzureCLI@2
              displayName: Terraform apply sandbox
              inputs:
                azureSubscription: 'sc-platform-sbx'
                scriptType: bash
                scriptLocation: scriptPath
                scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-apply.sh
                arguments: >-
                  "$(terraformBackendFile)"
                  "$(downloadedPlanPath)"
                workingDirectory: $(selfRepoRoot)
                addSpnToEnvironment: true
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: ApplyDev
    displayName: Apply Dev
    dependsOn:
      - PlanDev
      #- ApplySandbox
    condition: succeeded()
    variables:
      azureSubscription: 'sc-platform-dev'
      terraformBackendFile: 'environments/dev/backend.hcl'
      downloadedPlanPath: '$(Pipeline.Workspace)/terraform-plan-dev/terraform.tfplan'
    jobs:
      - ${{ if eq(parameters.useEnvironmentApprovals, true) }}:
        - deployment: terraform_apply_dev
          displayName: Terraform Apply Dev
          environment: ${{ parameters.devEnvironmentName }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    clean: true
                    persistCredentials: true
                    path: s/landingzone
                  - checkout: templateRepo
                    clean: true
                    persistCredentials: true
                    path: s/template

                  - task: Bash@3
                    displayName: Install Terraform
                    inputs:
                      targetType: filePath
                      filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
                      arguments: $(terraformVersion)
                      workingDirectory: $(selfRepoRoot)

                  - task: DownloadPipelineArtifact@2
                    displayName: Download dev plan artifact
                    inputs:
                      buildType: current
                      artifactName: terraform-plan-dev
                      targetPath: $(Pipeline.Workspace)/terraform-plan-dev

                  - task: AzureCLI@2
                    displayName: Terraform apply dev
                    inputs:
                      azureSubscription: 'sc-platform-dev'
                      scriptType: bash
                      scriptLocation: scriptPath
                      scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-apply.sh
                      arguments: >-
                        "$(terraformBackendFile)"
                        "$(downloadedPlanPath)"
                      workingDirectory: $(selfRepoRoot)
                      addSpnToEnvironment: true
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - ${{ if ne(parameters.useEnvironmentApprovals, true) }}:
        - job: terraform_apply_dev
          displayName: Terraform Apply Dev
          steps:
            - checkout: self
              clean: true
              persistCredentials: true
              path: s/landingzone
            - checkout: templateRepo
              clean: true
              persistCredentials: true
              path: s/template

            - task: Bash@3
              displayName: Install Terraform
              inputs:
                targetType: filePath
                filePath: $(selfRepoRoot)/scripts/azure-pipelines/install-terraform.sh
                arguments: $(terraformVersion)
                workingDirectory: $(selfRepoRoot)

            - task: DownloadPipelineArtifact@2
              displayName: Download dev plan artifact
              inputs:
                buildType: current
                artifactName: terraform-plan-dev
                targetPath: $(Pipeline.Workspace)/terraform-plan-dev

            - task: AzureCLI@2
              displayName: Terraform apply dev
              inputs:
                azureSubscription: 'sc-platform-dev'
                scriptType: bash
                scriptLocation: scriptPath
                scriptPath: $(selfRepoRoot)/scripts/azure-pipelines/terraform-apply.sh
                arguments: >-
                  "$(terraformBackendFile)"
                  "$(downloadedPlanPath)"
                workingDirectory: $(selfRepoRoot)
                addSpnToEnvironment: true
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: CreateGitTag
    displayName: Create Git Tag
    dependsOn:
      - ApplySandbox
      - ApplyDev
    condition: and(or(succeeded('ApplyDev'), succeeded('ApplySandbox')), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: create_git_tag
        displayName: Create Git Tag
        steps:
          - checkout: self
            clean: true
            persistCredentials: true
            fetchDepth: 0

          - task: Bash@3
            displayName: Create annotated semantic version tag
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                source_branch="$(Build.SourceBranchName)"
                source_sha="$(Build.SourceVersion)"

                git fetch --force --tags

                latest_tag="$(git tag --list 'v[1-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
                if [[ -z "${latest_tag}" ]]; then
                  latest_tag="v1.0.0"
                  previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
                  if [[ -n "${previous_tag}" ]]; then
                    commit_range="${previous_tag}..${source_sha}"
                  else
                    commit_range="${source_sha}"
                  fi
                else
                  commit_range="${latest_tag}..${source_sha}"
                fi

                commits="$(git log --format=%B ${commit_range})"
                release_notes="$(git log --format='- %s (%h)' ${commit_range} | sed -n '1,20p')"
                if [[ -z "${release_notes}" ]]; then
                  release_notes="- ${source_sha}"
                fi

                # Azure DevOps owns release versioning for this repo.
                # Every non-breaking release increments patch so GitHub and ADO stay aligned.
                if grep -Eq '(^|[[:space:]])BREAKING[ -]CHANGE:|^[a-zA-Z][a-zA-Z0-9-]*(\([^)]+\))?!:' <<< "${commits}"; then
                  bump="major"
                else
                  echo "No breaking change detected; defaulting to patch bump."
                  bump="patch"
                fi

                version="${latest_tag#v}"
                IFS='.' read -r major minor patch <<< "${version}"

                case "${bump}" in
                  major)
                    major=$((major + 1))
                    minor=0
                    patch=0
                    ;;
                  patch)
                    patch=$((patch + 1))
                    ;;
                esac

                tag_name="v${major}.${minor}.${patch}"

                if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
                  echo "Tag ${tag_name} already exists; leaving it unchanged."
                  exit 0
                fi

                if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
                  echo "Remote already has tag ${tag_name}; leaving it unchanged."
                  exit 0
                fi

                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@local"

                tag_message="$(mktemp)"
                {
                  echo "Release ${tag_name} (${bump})"
                  echo
                  echo "Source: ${source_branch}@${source_sha}"
                  echo "Range: ${commit_range}"
                  echo
                  echo "Changes:"
                  printf '%s\n' "${release_notes}"
                } > "${tag_message}"

                git tag -a "${tag_name}" "${source_sha}" -F "${tag_message}"
                git push origin "refs/tags/${tag_name}"
